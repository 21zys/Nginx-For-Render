<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuneHub Lite | 悦听音乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' },
                        dark: { 800: '#121212', 900: '#0a0a0a', 700: '#18181b' }
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #e2e8f0; }
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* 歌词高亮动画 */
        .lrc-item { transition: all 0.3s ease; opacity: 0.5; transform: scale(0.95); transform-origin: left center; }
        .lrc-active { opacity: 1; transform: scale(1.1); font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        
        /* 玻璃拟态 */
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* 旋转唱片 */
        .disk-spin { animation: spin 20s linear infinite; }
        .disk-paused { animation-play-state: paused; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 隐藏移动端 Input 默认样式 */
        input[type="range"] { -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #fff; margin-top: -4px; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #4b5563; border-radius: 2px; }
        
        /* 歌词遮罩 */
        .mask-image-linear { mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%); }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden text-sm md:text-base">

    <!-- 顶部布局：侧边栏 + 主内容 -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- 侧边栏 (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 bg-dark-800 border-r border-gray-800 shrink-0">
            <div class="p-6">
                <div class="flex items-center gap-2 text-brand-500 font-bold text-xl">
                    <i data-lucide="music-2"></i> TuneHub
                </div>
            </div>
            
            <nav class="flex-1 px-4 space-y-6 overflow-y-auto">
                <div>
                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-2">发现</div>
                    <div class="space-y-1">
                        <button onclick="app.navigate('search')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-lg text-white bg-gray-700 transition-colors">
                            <i data-lucide="search" size="18"></i> 搜索音乐
                        </button>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between px-2 mb-3">
                        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">我的歌单</div>
                        <button onclick="app.createPlaylist()" class="text-gray-400 hover:text-white p-1 rounded hover:bg-gray-700 transition">
                            <i data-lucide="plus" size="14"></i>
                        </button>
                    </div>
                    <div class="space-y-1" id="playlist-nav">
                        <!-- 动态生成歌单列表 -->
                    </div>
                </div>
            </nav>
            <div class="mt-auto pt-4 border-t border-gray-800">
                <button onclick="backupMgr.showModal()" class="w-full flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                    <i data-lucide="settings" size="18"></i> 系统备份设置
                </button>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="flex-1 flex flex-col bg-dark-900 relative min-w-0">
            <!-- 移动端 Header -->
            <header class="md:hidden flex items-center justify-between p-4 bg-dark-800 border-b border-gray-800 z-20 shrink-0">
                <div class="font-bold text-lg flex items-center gap-2"><i data-lucide="music-2" class="text-brand-500"></i> TuneHub</div>
                <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="p-2 text-gray-300">
                    <i data-lucide="menu"></i>
                </button>
            </header>
            
            <!-- 移动端菜单 -->
            <div id="mobile-menu" class="hidden absolute top-[60px] left-0 w-full bg-dark-800 border-b border-gray-800 z-30 shadow-2xl">
                <nav class="p-4 space-y-2">
                    <button onclick="app.navigate('search'); toggleMobileMenu()" class="w-full text-left px-3 py-3 rounded-lg hover:bg-gray-700 text-gray-200">🔍 搜索音乐</button>
                    <div class="pt-2 border-t border-gray-700 text-xs text-gray-500 uppercase">我的歌单</div>
                    <div id="mobile-playlist-nav" class="space-y-1"></div>
                    <button onclick="app.createPlaylist(); toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm text-brand-500 mt-2 font-medium">+ 新建歌单</button>
                </nav>
                <button onclick="backupMgr.showModal(); toggleMobileMenu()" class="w-full flex items-center gap-3 px-3 py-3 border-t border-gray-700 text-sm font-medium text-gray-400 hover:text-white transition-colors mt-2">
                    <i data-lucide="settings" size="18"></i> 系统备份设置
                </button>
            </div>

            <!-- 视图容器 -->
            <div id="view-container" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth pb-32">
                
                <!-- 搜索视图 -->
                <div id="view-search" class="max-w-6xl mx-auto w-full">
                    <div class="mb-8">
                        <div class="flex flex-col md:flex-row gap-3 relative group">
                            <!-- 来源选择 -->
                            <select id="search-source" class="bg-dark-800 text-white px-4 py-4 rounded-2xl border-2 border-transparent focus:border-brand-600 outline-none transition-all shadow-lg appearance-none cursor-pointer">
                                <option value="aggregateSearch">聚合搜索</option>
                                <option value="netease">网易云音乐</option>
                                <option value="kuwo">酷我音乐</option>
                                <option value="qq">QQ音乐</option>
                            </select>
                            
                            <!-- 输入框容器 -->
                            <div class="relative flex-1">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i data-lucide="search" class="text-gray-400"></i>
                                </div>
                                <input type="text" id="search-input" 
                                    class="w-full bg-dark-800 text-white pl-12 pr-4 py-4 rounded-2xl border-2 border-transparent focus:border-brand-600 focus:outline-none transition-all shadow-lg placeholder-gray-500 text-lg"
                                    placeholder="搜索歌曲、歌手..."
                                    onkeydown="if(event.key === 'Enter') app.search(this.value, true)"
                                >
                                <button onclick="app.search(document.getElementById('search-input').value, true)" class="absolute right-2 top-2 bottom-2 bg-brand-600 hover:bg-brand-500 text-white px-6 rounded-xl font-medium transition-colors">
                                    搜索
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 搜索结果列表 -->
                    <div id="search-status" class="text-center text-gray-500 py-20 hidden">
                        <i data-lucide="music" class="mx-auto mb-4 opacity-50" size="48"></i>
                        <p>输入关键词开始搜索音乐世界</p>
                    </div>

                    <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 结果卡片渲染区 -->
                    </div>
                </div>

                <!-- 歌单详情视图 -->
                <div id="view-playlist" class="hidden max-w-6xl mx-auto w-full">
                    <div class="flex flex-col md:flex-row items-center md:items-end gap-6 mb-8 border-b border-gray-800 pb-8 text-center md:text-left">
                        <div class="w-32 h-32 md:w-48 md:h-48 bg-gradient-to-br from-brand-500 to-purple-600 rounded-lg shadow-2xl flex items-center justify-center shrink-0">
                            <i data-lucide="list-music" size="64" class="text-white opacity-80"></i>
                        </div>
                        <div class="flex-1 min-w-0 w-full">
                            <div class="text-sm font-medium text-brand-500 uppercase mb-2">歌单</div>
                            <h1 id="playlist-title" class="text-3xl md:text-5xl font-bold text-white mb-4 truncate">我的收藏</h1>
                            <div class="flex flex-col md:flex-row items-center gap-4 text-sm text-gray-400 justify-center md:justify-start">
                                <span id="playlist-count">0 首歌曲</span>
                                <button onclick="app.playAllInPlaylist()" class="flex items-center gap-2 bg-brand-600 text-white px-6 py-2 rounded-full hover:bg-brand-500 transition-colors shadow-lg shadow-brand-500/20">
                                    <i data-lucide="play" size="16"></i> 播放全部
                                </button>
                                <button onclick="app.deleteCurrentPlaylist()" id="btn-del-playlist" class="flex items-center gap-2 text-red-400 hover:text-red-300 transition-colors hidden px-4 py-2 hover:bg-red-500/10 rounded-full">
                                    <i data-lucide="trash-2" size="16"></i> 删除歌单
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="bg-dark-800/50 rounded-xl overflow-hidden border border-gray-800">
                        <table class="w-full text-left text-sm text-gray-400">
                            <thead class="bg-dark-800 text-gray-200 uppercase text-xs font-semibold">
                                <tr>
                                    <th class="px-4 md:px-6 py-3 w-12 md:w-16">#</th>
                                    <th class="px-4 md:px-6 py-3">歌曲标题</th>
                                    <th class="px-4 md:px-6 py-3 hidden md:table-cell">歌手</th>
                                    <th class="px-4 md:px-6 py-3 w-24 text-center hidden sm:table-cell">来源</th>
                                    <th class="px-4 md:px-6 py-3 w-16 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="playlist-songs" class="divide-y divide-gray-800">
                                <!-- 歌曲列表 -->
                            </tbody>
                        </table>
                        <div id="playlist-empty" class="p-10 text-center text-gray-500 hidden">
                            这个歌单还是空的，快去搜索添加吧
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- 底部播放栏 -->
    <div id="player-bar" class="min-h-[5rem] md:h-24 bg-dark-800 border-t border-gray-800 flex items-center px-4 md:px-6 z-50 glass relative shrink-0 pb-[safe-area-inset-bottom]">
        <!-- 歌曲信息 -->
        <div class="w-1/3 md:w-1/4 flex items-center gap-3 md:gap-4 overflow-hidden" onclick="app.toggleLyricsPage()">
            <img id="player-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23333'%3E%3Crect width='100' height='100'/%3E%3C/svg%3E" class="h-10 w-10 md:h-14 md:w-14 rounded bg-gray-700 object-cover cursor-pointer hover:opacity-80 transition shadow-lg" alt="Cover">
            <div class="min-w-0 cursor-pointer group">
                <div id="player-title" class="text-white text-sm md:text-base font-medium truncate group-hover:text-brand-500 transition">TuneHub</div>
                <div id="player-artist" class="text-gray-400 text-xs truncate">Ready to play</div>
            </div>
        </div>

        <!-- 移动端播放按钮 -->
        <div class="md:hidden absolute right-4 flex items-center gap-4">
             <button onclick="app.togglePlay()" class="p-2 text-white bg-brand-600 rounded-full shadow-lg">
                <i id="mobile-play-icon" data-lucide="play" size="20" class="fill-current ml-0.5"></i>
            </button>
             <button onclick="app.toggleLyricsPage()" class="p-2 text-gray-400">
                <i data-lucide="chevron-up" size="20"></i>
            </button>
        </div>

        <!-- 播放控制 (Desktop) -->
        <div class="hidden md:flex flex-col items-center justify-center w-1/2">
            <div class="flex items-center gap-6 mb-1">
                <button onclick="app.setMode()" id="btn-mode" class="text-gray-400 hover:text-white transition" title="循环模式">
                    <i data-lucide="repeat" size="18"></i>
                </button>
                <button onclick="app.prev()" class="text-gray-300 hover:text-white transition hover:scale-110">
                    <i data-lucide="skip-back" size="24" class="fill-current"></i>
                </button>
                <button onclick="app.togglePlay()" class="bg-white rounded-full p-2 text-black hover:scale-105 transition shadow-lg">
                    <i id="main-play-icon" data-lucide="play" size="24" class="fill-current ml-0.5"></i>
                </button>
                <button onclick="app.next()" class="text-gray-300 hover:text-white transition hover:scale-110">
                    <i data-lucide="skip-forward" size="24" class="fill-current"></i>
                </button>
                <button onclick="app.addToPlaylistUI()" class="text-gray-400 hover:text-brand-500 transition" title="收藏当前">
                    <i id="player-fav-icon" data-lucide="heart" size="18"></i>
                </button>
            </div>
            <div class="w-full max-w-md flex items-center gap-3 text-xs text-gray-400 font-mono">
                <span id="time-current">00:00</span>
                <div class="flex-1 h-1 bg-gray-700 rounded-full relative group cursor-pointer" id="progress-container">
                    <div id="progress-bar" class="absolute top-0 left-0 h-full bg-brand-500 rounded-full w-0 group-hover:bg-brand-400"></div>
                </div>
                <span id="time-total">00:00</span>
            </div>
        </div>

        <!-- 音量/功能 (Desktop) -->
        <div class="hidden md:flex w-1/4 justify-end items-center gap-4">
            <button onclick="app.toggleLyricsPage()" class="text-gray-400 hover:text-white p-2 rounded hover:bg-white/10" title="打开歌词">
                <i data-lucide="mic-2" size="20"></i>
            </button>
            <div class="flex items-center gap-2 group w-32">
                <i data-lucide="volume-2" class="text-gray-400" size="18"></i>
                <input type="range" min="0" max="1" step="0.05" value="1" oninput="app.setVolume(this.value)" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer hover:h-1.5 transition-all">
            </div>
        </div>
    </div>

    <!-- 全屏歌词页 -->
    <div id="lyrics-page" class="fixed inset-0 bg-dark-900 z-[60] transform translate-y-full transition-transform duration-500 flex flex-col">
        <!-- 背景模糊层 -->
        <div id="lyrics-bg" class="absolute inset-0 bg-cover bg-center opacity-30 blur-3xl scale-110 pointer-events-none transition-all duration-1000"></div>
        <div class="absolute inset-0 bg-black/40 pointer-events-none"></div>

        <!-- 顶部导航 -->
        <div class="relative z-10 flex items-center justify-between p-4 md:p-6 md:px-12">
            <button onclick="app.toggleLyricsPage()" class="text-white/70 hover:text-white hover:bg-white/10 p-2 rounded-full transition">
                <i data-lucide="chevron-down" size="32"></i>
            </button>
            <div class="text-center">
                <div class="text-gray-400 text-xs tracking-widest uppercase mb-1">正在播放</div>
                <div class="text-xs font-mono text-gray-500 px-2 py-0.5 border border-gray-600 rounded inline-block" id="lyrics-platform-badge">NETEASE</div>
            </div>
            <button onclick="app.addToPlaylistUI()" class="text-white/70 hover:text-brand-500 p-2 transition">
                <i id="lyrics-fav-icon" data-lucide="heart" size="28"></i>
            </button>
        </div>

        <!-- 歌词内容区 -->
        <div class="relative z-10 flex-1 flex flex-col md:flex-row items-center justify-start md:justify-center gap-4 md:gap-20 p-4 md:p-8 overflow-hidden">
            <!-- 唱片封面区 (左侧/上方) -->
            <div class="w-full md:w-1/2 flex items-center justify-center flex-col shrink-0 mt-24 md:mt-0">
                <div class="relative mt-36 w-48 h-48 sm:w-64 sm:h-64 rounded-full overflow-hidden shadow-2xl border-4 border-white/10 ring-1 ring-white/5 shrink-0">
                    <img id="lyrics-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23333'%3E%3Crect width='100' height='100'/%3E%3C/svg%3E" class="w-full h-full object-cover disk-spin disk-paused" alt="Album Art">
                    <!-- 中心孔 -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-dark-900 rounded-full border border-gray-700 flex items-center justify-center">
                        <div class="w-4 h-4 bg-black rounded-full"></div>
                    </div>
                </div>
                <div class="mt-4 text-center max-w-md mx-auto">
                    <h2 id="lyrics-title" class="text-2xl md:text-3xl font-bold text-white mb-2 line-clamp-2">TuneHub</h2>
                    <p id="lyrics-artist" class="text-lg text-gray-300 truncate">Ready to play</p>
                </div>
            </div>

            <!-- 歌词滚动区 (右侧/下方) -->
            <div class="w-full md:w-1/2 flex-1 md:h-[60vh] relative mask-image-linear min-h-[20rem]">
                <div id="lyrics-container" class="h-full overflow-y-auto scroll-smooth text-center space-y-6 py-[50%] px-4 no-scrollbar">
                    <p class="text-gray-400">点击播放开始听歌</p>
                </div>
            </div>
        </div>

        <!-- 底部控制栏 (全屏模式) -->
        <div class="relative z-10 p-8 md:px-20 bg-gradient-to-t from-black/90 to-transparent">
            <div class="flex items-center justify-between text-xs text-gray-400 font-mono mb-4">
                <span id="lyrics-time-current">00:00</span>
                <span id="lyrics-time-total">00:00</span>
            </div>
            <div class="h-1.5 bg-white/20 rounded-full cursor-pointer mb-8 relative hover:h-2 transition-all" id="lyrics-progress-container">
                <div id="lyrics-progress-bar" class="absolute top-0 left-0 h-full bg-brand-500 rounded-full w-0 shadow-[0_0_10px_rgba(99,102,241,0.5)]"></div>
            </div>
            <div class="flex justify-center items-center gap-8 md:gap-12">
                <button onclick="app.setMode()" id="lyrics-btn-mode" class="text-gray-400 hover:text-white"><i data-lucide="repeat" size="24"></i></button>
                <button onclick="app.prev()" class="text-white hover:scale-110 transition"><i data-lucide="skip-back" size="32" class="fill-white"></i></button>
                <button onclick="app.togglePlay()" class="bg-brand-500 text-white rounded-full p-4 hover:scale-110 hover:bg-brand-400 transition shadow-lg shadow-brand-500/30">
                    <i id="lyrics-play-icon" data-lucide="play" size="32" class="fill-current ml-1"></i>
                </button>
                <button onclick="app.next()" class="text-white hover:scale-110 transition"><i data-lucide="skip-forward" size="32" class="fill-white"></i></button>
                <button onclick="app.showAddToPlaylistModal(app.state.currentSong)" class="text-gray-400 hover:text-white"><i data-lucide="list-plus" size="24"></i></button>
            </div>
        </div>
    </div>

    <!-- 全局 Audio 元素 -->
    <audio id="audio-player" preload="none"></audio>

    <!-- 弹窗/模态框 -->
    <div id="modal-playlist" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-dark-800 rounded-xl max-w-sm w-full p-6 border border-gray-700 shadow-2xl transform transition-all">
            <h3 class="text-lg font-bold text-white mb-4">收藏到歌单</h3>
            <div id="modal-playlist-list" class="space-y-2 max-h-60 overflow-y-auto mb-4 pr-1">
                <!-- 列表 -->
            </div>
            <div class="flex gap-3">
                <button onclick="document.getElementById('modal-playlist').classList.add('hidden')" class="flex-1 py-2.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium transition">取消</button>
                <button onclick="app.createPlaylist()" class="flex-1 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium transition">新建歌单</button>
            </div>
        </div>
    </div>


    <div id="modal-backup-settings" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-dark-800 rounded-xl max-w-md w-full p-6 border border-gray-700 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-white">S3 自动备份配置</h3>
                <button onclick="backupMgr.hideModal()" class="text-gray-500 hover:text-white"><i data-lucide="x" size="20"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Worker 接口地址</label>
                    <input type="text" id="cfg-worker-url" placeholder="https://your-worker.workers.dev" class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">备份目录</label>
                        <input type="text" id="cfg-backup-path" placeholder="music-backup" class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">保留历史数</label>
                        <input type="number" id="cfg-retention" value="5" class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">备份模式</label>
                    <select id="cfg-mode" class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                        <option value="manual">手动备份</option>
                        <option value="instant">实时备份 (修改即同步)</option>
                        <option value="interval">定时备份 (自定义间隔)</option>
                    </select>
                </div>
                <div id="cfg-interval-box" class="hidden">
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">定时统计 (分钟)</label>
                    <input type="number" id="cfg-interval" value="30" class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                </div>
                <div class="flex items-center gap-2 py-2">
                    <input type="checkbox" id="cfg-auto-sync" class="w-4 h-4 rounded border-gray-700 bg-dark-900 text-brand-600">
                    <label for="cfg-auto-sync" class="text-sm text-gray-300">启动页面时自动加载最新备份</label>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="backupMgr.saveConfig()" class="col-span-2 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium transition">保存配置</button>
                
                <button onclick="backupMgr.manualBackup()" class="py-2.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium transition flex items-center justify-center gap-2">
                    <i data-lucide="upload-cloud" size="16"></i> 立即备份
                </button>
                
                <button onclick="backupMgr.manualRestore()" class="py-2.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium transition flex items-center justify-center gap-2">
                    <i data-lucide="download-cloud" size="16"></i> 从云端恢复
                </button>
            </div>
        </div>
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        const API_BASE = 'https://nginx.21zys.com/music';

        // ------------------------------------------------------------
        // 配置区域：反向代理设置
        // ------------------------------------------------------------
        const USER_CONFIG = {
            // TODO: 请修改为你的实际域名，例如 https://music.example.com
            // 注意：不要带末尾的斜杠
            customDomain: 'https://nginx.21zys.com/img1_kuwo', 
            
            // 启用代理
            enableProxy: true
        };

        // 图片 URL 处理工具函数
        function getCoverUrl(song) {
            // 1. 优先尝试使用歌曲对象中自带的 pic 字段 (假设 API 返回了原始链接)
            let url = song.pic || `${API_BASE}/api/?source=${song.platform}&type=pic&id=${song.id}`;
            
            // 2. 针对酷我音乐的图片跨域处理 (替换 img1.kwcdn.kuwo.cn)
            if (USER_CONFIG.enableProxy) {
                if (url.includes('img1.kwcdn.kuwo.cn')) {
                    // 原有逻辑：处理 kuwo 图片域名
                    // 将 https://img1.kwcdn.kuwo.cn/xxx 替换为 https://your-domain.com/img1_kuwo/xxx
                    return url.replace(/https?:\/\/img1\.kwcdn\.kuwo\.cn/, `${USER_CONFIG.customDomain}/img1_kuwo`);
                } else if (url.includes('music-dl.sayqz.com')) {
                    // 新增逻辑：处理 sayqz 域名
                    // 将 https://music-dl.sayqz.com 替换为 customDomain 变量的内容
                    return url.replace('https://music-dl.sayqz.com', API_BASE);
                }
            }
            
            return url;
        }
        
        // 数据持久化管理 (LocalStorage)
        const Storage = {
            getKey: () => 'tunehub_v1_data',
            get: () => JSON.parse(localStorage.getItem(Storage.getKey()) || '{"playlists": {"我喜欢的音乐": []}}'),
            save: (data) => localStorage.setItem(Storage.getKey(), JSON.stringify(data)),
            
            getPlaylists: () => Storage.get().playlists,
            
            addPlaylist: (name) => {
                const data = Storage.get();
                if (!data.playlists[name]) {
                    data.playlists[name] = [];
                    Storage.save(data);
                    return true;
                }
                return false;
            },
            
            deletePlaylist: (name) => {
                if(name === '我喜欢的音乐') return false;
                const data = Storage.get();
                delete data.playlists[name];
                Storage.save(data);
                return true;
            },
            
            addSong: (playlistName, song) => {
                if(!song) return false;
                const data = Storage.get();
                if (!data.playlists[playlistName]) return false;
                // 简单去重
                if (!data.playlists[playlistName].some(s => s.id == song.id && s.platform == song.platform)) {
                    data.playlists[playlistName].push(song);
                    Storage.save(data);
                    return true;
                }
                return false;
            },
            
            removeSong: (playlistName, songId) => {
                const data = Storage.get();
                if (!data.playlists[playlistName]) return;
                data.playlists[playlistName] = data.playlists[playlistName].filter(s => s.id != songId);
                Storage.save(data);
            },
            
            isLiked: (song) => {
                if(!song) return false;
                const list = Storage.get().playlists['我喜欢的音乐'] || [];
                return list.some(s => s.id == song.id && s.platform == song.platform);
            }
        };

        // 核心应用逻辑
        const app = {
            state: {
                currentSong: null,
                isPlaying: false,
                playlist: [],
                currentIndex: -1,
                lyrics: [],
                mode: 'loop',
                activePlaylistView: null,
                // --- 新增分页状态 ---
                searchMeta: {
                    keyword: '',
                    source: 'aggregateSearch',
                    page: 1,
                    limit: 20,
                    hasMore: true,
                    isLoading: false
                }
            },
            
            elements: {
                audio: document.getElementById('audio-player'),
            },

            init() {
                this.renderNav();
                
                // 监听 Audio 事件
                const audio = this.elements.audio;
                audio.addEventListener('timeupdate', () => this.onTimeUpdate());
                audio.addEventListener('ended', () => this.next());
                audio.addEventListener('play', () => this.updatePlayState(true));
                audio.addEventListener('pause', () => this.updatePlayState(false));
                audio.addEventListener('error', (e) => {
                    console.error("Audio Error, trying next", e);
                    // 播放出错自动跳过
                    if(this.state.currentSong && this.state.playlist.length > 1) {
                         setTimeout(() => this.next(), 2000);
                    }
                });

                // 进度条拖拽
                const handleProgressClick = (e, containerId) => {
                    const container = document.getElementById(containerId);
                    const rect = container.getBoundingClientRect();
                    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    if(audio.duration) {
                        audio.currentTime = percent * audio.duration;
                    }
                };
                document.getElementById('progress-container').onclick = (e) => handleProgressClick(e, 'progress-container');
                document.getElementById('lyrics-progress-container').onclick = (e) => handleProgressClick(e, 'lyrics-progress-container');
                
                // 默认加载
                document.getElementById('view-search').classList.remove('hidden');
                document.getElementById('search-status').classList.remove('hidden');

                // 滚动加载更多
                const container = document.getElementById('view-container');
                container.addEventListener('scroll', () => {
                    // 只有在搜索视图且不在加载中时触发
                    if (document.getElementById('view-search').classList.contains('hidden')) return;
                    
                    const { scrollTop, scrollHeight, clientHeight } = container;
                    // 距离底部 100px 时加载下一页
                    if (scrollTop + clientHeight >= scrollHeight - 100) {
                        if (!this.state.searchMeta.isLoading && this.state.searchMeta.hasMore) {
                            this.search(this.state.searchMeta.keyword, false);
                        }
                    }
                });
            },

            // 路由导航
            navigate(view) {
                document.getElementById('view-search').classList.add('hidden');
                document.getElementById('view-playlist').classList.add('hidden');
                
                // 侧边栏样式重置
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('bg-gray-700', 'text-white');
                    b.classList.add('text-gray-400', 'hover:text-white');
                });

                if (view === 'search') {
                    document.getElementById('view-search').classList.remove('hidden');
                    // Update active tab style (simple)
                    document.querySelector(`button[onclick="app.navigate('search')"]`).classList.add('bg-gray-700', 'text-white');
                }
            },

            openPlaylist(name) {
                this.navigate('playlist');
                document.getElementById('view-playlist').classList.remove('hidden');
                
                const playlists = Storage.getPlaylists();
                const songs = playlists[name] || [];
                
                this.state.activePlaylistView = name;
                document.getElementById('playlist-title').innerText = name;
                document.getElementById('playlist-count').innerText = `${songs.length} 首歌曲`;
                
                // 默认歌单不可删除
                const isDefault = name === '我喜欢的音乐';
                document.getElementById('btn-del-playlist').classList.toggle('hidden', isDefault);

                const tbody = document.getElementById('playlist-songs');
                tbody.innerHTML = '';

                if (songs.length === 0) {
                    document.getElementById('playlist-empty').classList.remove('hidden');
                } else {
                    document.getElementById('playlist-empty').classList.add('hidden');
                    songs.forEach((song, index) => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-white/5 transition group border-b border-gray-800 last:border-0";
                        tr.innerHTML = `
                            <td class="px-4 md:px-6 py-3 font-mono text-gray-500 w-12 text-center md:text-left">${index + 1}</td>
                            <td class="px-4 md:px-6 py-3">
                                <div class="font-medium text-white group-hover:text-brand-500 cursor-pointer line-clamp-1" onclick='app.playFromPlaylist("${name}", ${index})'>${song.name}</div>
                            </td>
                            <td class="px-4 md:px-6 py-3 text-gray-400 hidden md:table-cell line-clamp-1">${song.artist}</td>
                            <td class="px-4 md:px-6 py-3 hidden sm:table-cell text-center">
                                <span class="text-[10px] px-2 py-0.5 rounded bg-gray-700 text-gray-400 uppercase tracking-wide">${song.platform}</span>
                            </td>
                            <td class="px-4 md:px-6 py-3 text-right">
                                <button onclick="app.removeFromPlaylist('${name}', '${song.id}')" class="text-gray-500 hover:text-red-500 p-2 rounded hover:bg-white/5 transition">
                                    <i data-lucide="trash" size="16"></i>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                }
            },

            // 功能：搜索
            async search(keyword, isNewSearch = true) {
                if (!keyword.trim()) return;
            
                const meta = this.state.searchMeta;
                const resultsEl = document.getElementById('search-results');
                const status = document.getElementById('search-status');
                const source = document.getElementById('search-source').value;
            
                // 如果是新搜索，重置分页和内容
                if (isNewSearch) {
                    meta.page = 1;
                    meta.keyword = keyword;
                    meta.source = source;
                    meta.hasMore = true;
                    resultsEl.innerHTML = '';
                    window.getElementById('view-container').scrollTop = 0;
                    
                    status.classList.remove('hidden');
                    status.innerHTML = `<i data-lucide="loader-2" class="animate-spin mx-auto mb-2 text-brand-500" size="32"></i><p>正在搜索...</p>`;
                    lucide.createIcons();
                }
            
                if (meta.isLoading || !meta.hasMore) return;
                meta.isLoading = true;
            
                // 只有聚合搜索不需要 source 参数，普通搜索需要
                const typeParam = meta.source === 'aggregateSearch' ? 'aggregateSearch' : 'search';
                const sourceParam = meta.source === 'aggregateSearch' ? '' : `&source=${meta.source}`;
                const url = `${API_BASE}/api/?type=${typeParam}${sourceParam}&keyword=${encodeURIComponent(meta.keyword)}&page=${meta.page}&limit=${meta.limit}`;
            
                try {
                    const res = await fetch(url);
                    const json = await res.json();
                    
                    if (json.code === 200 && json.data.results && json.data.results.length > 0) {
                        status.classList.add('hidden');
                        
                        json.data.results.forEach(song => {
                            const card = document.createElement('div');
                            card.className = "bg-dark-800 hover:bg-gray-800 p-3 md:p-4 rounded-xl transition flex gap-4 group border border-transparent hover:border-brand-500/30 shadow-sm hover:shadow-lg";
                            
                            const picUrl = getCoverUrl(song);
                            let platformColor = 'text-gray-400';
                            if(song.platform === 'netease') platformColor = 'text-red-400';
                            if(song.platform === 'qq') platformColor = 'text-green-400';
                            if(song.platform === 'kuwo') platformColor = 'text-yellow-400';
            
                            card.innerHTML = `
                                <div class="relative w-16 h-16 md:w-20 md:h-20 shrink-0 rounded-lg overflow-hidden bg-gray-900 shadow-inner">
                                    <img src="${picUrl}" loading="lazy" class="w-full h-full object-cover transition duration-500 group-hover:scale-110" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\' fill=\'%23333\'%3E%3Crect width=\'100\' height=\'100\'/%3E%3C/svg%3E'">
                                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition cursor-pointer" onclick='app.playSingleSong(${JSON.stringify(song).replace(/'/g, "&#39;")})'>
                                        <i data-lucide="play-circle" class="text-white fill-brand-500 border-none" size="32"></i>
                                    </div>
                                </div>
                                <div class="flex-1 min-w-0 flex flex-col justify-center gap-1">
                                    <div class="text-white font-medium truncate text-base md:text-lg cursor-pointer hover:text-brand-500 transition" onclick='app.playSingleSong(${JSON.stringify(song).replace(/'/g, "&#39;")})'>${song.name}</div>
                                    <div class="text-gray-400 text-xs md:text-sm truncate flex items-center gap-2">
                                        <span class="text-[10px] uppercase font-bold tracking-wider ${platformColor}">${song.platform}</span>
                                        <span class="w-1 h-1 rounded-full bg-gray-600"></span>
                                        ${song.artist}
                                    </div>
                                </div>
                                <div class="flex flex-col justify-center gap-2">
                                    <button onclick='app.showAddToPlaylistModal(${JSON.stringify(song).replace(/'/g, "&#39;")})' class="text-gray-500 hover:text-brand-500 transition p-2 hover:bg-gray-700/50 rounded-full" title="添加到歌单">
                                        <i data-lucide="plus-circle" size="20"></i>
                                    </button>
                                </div>
                            `;
                            resultsEl.appendChild(card);
                        });
                        
                        lucide.createIcons();
                        meta.page++; // 准备下一页
                        
                        // 如果返回的数据少于 limit，说明没更多了
                        if (json.data.results.length < meta.limit) {
                            meta.hasMore = false;
                        }
                    } else {
                        if (isNewSearch) {
                            status.classList.remove('hidden');
                            status.innerHTML = "未找到相关歌曲，请换个关键词";
                        }
                        meta.hasMore = false;
                    }
                } catch (e) {
                    console.error(e);
                    if (isNewSearch) {
                        status.innerHTML = "搜索服务异常";
                    }
                } finally {
                    meta.isLoading = false;
                }
            },

            // 播放系统
            async playSingleSong(song) {
                // 替换当前播放列表
                this.state.playlist = [song];
                this.state.currentIndex = 0;
                this.loadSong(song);
            },
            
            playFromPlaylist(playlistName, index) {
                const list = Storage.getPlaylists()[playlistName];
                if(list && list.length > 0) {
                    this.state.playlist = [...list];
                    this.state.currentIndex = index;
                    this.loadSong(list[index]);
                }
            },

            playAllInPlaylist() {
                if(this.state.activePlaylistView) {
                    this.playFromPlaylist(this.state.activePlaylistView, 0);
                }
            },

            async loadSong(song) {
                if(!song) return;
                this.state.currentSong = song;
                
                // 1. UI 更新 (使用代理后的图片地址)
                const picUrl = getCoverUrl(song);
                
                // 底部栏
                document.getElementById('player-title').innerText = song.name;
                document.getElementById('player-artist').innerText = song.artist;
                document.getElementById('player-cover').src = picUrl;
                
                // 全屏歌词页
                document.getElementById('lyrics-cover').src = picUrl;
                document.getElementById('lyrics-bg').style.backgroundImage = `url(${picUrl})`;
                document.getElementById('lyrics-title').innerText = song.name;
                document.getElementById('lyrics-artist').innerText = song.artist;
                document.getElementById('lyrics-platform-badge').innerText = song.platform.toUpperCase();
                
                this.updateLikeButton();

                // 2. 音频加载 (处理 Redirect)
                // 直接使用 API URL 作为 src，浏览器会自动处理 302 跳转
                const audioUrl = `${API_BASE}/api/?source=${song.platform}&type=url&id=${song.id}`;
                this.elements.audio.src = audioUrl;
                this.elements.audio.play().catch(e => console.warn("自动播放被浏览器拦截，请手动点击播放", e));
                
                // 3. 加载歌词
                this.fetchLyrics(song);
            },

            async fetchLyrics(song) {
                const container = document.getElementById('lyrics-container');
                container.innerHTML = '<p class="text-gray-500 mt-20 animate-pulse">歌词加载中...</p>';
                this.state.lyrics = [];
                
                try {
                    const res = await fetch(`${API_BASE}/api/?source=${song.platform}&type=lrc&id=${song.id}`);
                    const text = await res.text();
                    this.parseLyrics(text);
                } catch (e) {
                    container.innerHTML = '<p class="text-gray-500 mt-20">暂无歌词</p>';
                }
            },

            parseLyrics(lrcText) {
                const lines = lrcText.split('\n');
                const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
                const lyrics = [];
                
                lines.forEach(line => {
                    const matches = regex.exec(line);
                    if (matches) {
                        const min = parseInt(matches[1]);
                        const sec = parseInt(matches[2]);
                        // 处理毫秒（有的是2位有的是3位）
                        const ms = parseInt(matches[3].padEnd(3, '0')); 
                        const time = min * 60 + sec + ms / 1000;
                        const text = matches[4].trim();
                        if (text) lyrics.push({ time, text });
                    }
                });
                
                this.state.lyrics = lyrics;
                this.renderLyrics();
            },

            renderLyrics() {
                const container = document.getElementById('lyrics-container');
                if (this.state.lyrics.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 mt-40">此歌曲无歌词</p>';
                    return;
                }
                
                let html = '<div class="h-[40vh]"></div>'; // 顶部留白
                this.state.lyrics.forEach((line, index) => {
                    html += `<p class="lrc-item text-gray-400 py-3 text-lg md:text-2xl cursor-pointer hover:text-white transition font-medium" id="lrc-${index}" onclick="app.seekTo(${line.time})">${line.text}</p>`;
                });
                html += '<div class="h-[40vh]"></div>'; // 底部留白
                container.innerHTML = html;
            },

            seekTo(time) {
                this.elements.audio.currentTime = time;
            },

            onTimeUpdate() {
                const audio = this.elements.audio;
                if (!audio.duration) return;

                const percent = (audio.currentTime / audio.duration) * 100;
                const currentFmt = this.formatTime(audio.currentTime);
                const totalFmt = this.formatTime(audio.duration);

                // 更新时间文本
                document.getElementById('time-current').innerText = currentFmt;
                document.getElementById('time-total').innerText = totalFmt;
                document.getElementById('lyrics-time-current').innerText = currentFmt;
                document.getElementById('lyrics-time-total').innerText = totalFmt;

                // 更新进度条 UI
                document.getElementById('progress-bar').style.width = `${percent}%`;
                document.getElementById('lyrics-progress-bar').style.width = `${percent}%`;

                // 歌词滚动逻辑
                if (this.state.lyrics.length > 0) {
                    let activeIndex = -1;
                    // 查找当前时间点对应的最后一句歌词
                    for(let i=0; i<this.state.lyrics.length; i++) {
                        if (audio.currentTime >= this.state.lyrics[i].time) {
                            activeIndex = i;
                        } else {
                            break;
                        }
                    }

                    if (activeIndex !== -1) {
                        // 移除旧高亮
                        const oldActive = document.querySelector('.lrc-active');
                        if (oldActive) oldActive.classList.remove('lrc-active');

                        // 设置新高亮并滚动
                        const activeEl = document.getElementById(`lrc-${activeIndex}`);
                        if (activeEl) {
                            activeEl.classList.add('lrc-active');
                            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            },

            // 播放控制
            togglePlay() {
                const audio = this.elements.audio;
                if (!this.state.currentSong) return;
                
                if (audio.paused) audio.play();
                else audio.pause();
            },

            updatePlayState(isPlaying) {
                this.state.isPlaying = isPlaying;
                const disk = document.querySelector('.disk-spin');
                
                // 切换图标状态
                const updateIcon = (id) => {
                    const el = document.getElementById(id);
                    if(el) {
                         const parent = el.parentElement;
                         // 简单的图标切换逻辑
                         parent.innerHTML = isPlaying 
                            ? `<i id="${id}" data-lucide="pause" size="${el.getAttribute('size')}" class="fill-current"></i>`
                            : `<i id="${id}" data-lucide="play" size="${el.getAttribute('size')}" class="fill-current ${id==='main-play-icon'?'ml-0.5':''}"></i>`;
                    }
                }

                updateIcon('main-play-icon');
                updateIcon('mobile-play-icon');
                updateIcon('lyrics-play-icon');
                lucide.createIcons();

                // 唱片旋转
                if(isPlaying) disk.classList.remove('disk-paused');
                else disk.classList.add('disk-paused');
            },

            next() {
                if (this.state.playlist.length <= 1) {
                    this.elements.audio.currentTime = 0;
                    this.elements.audio.play();
                    return;
                }
                
                let nextIndex;
                if (this.state.mode === 'random') {
                    nextIndex = Math.floor(Math.random() * this.state.playlist.length);
                } else {
                    nextIndex = (this.state.currentIndex + 1) % this.state.playlist.length;
                }
                this.state.currentIndex = nextIndex;
                this.loadSong(this.state.playlist[nextIndex]);
            },

            prev() {
                if (this.state.playlist.length <= 1) return;
                let prevIndex = (this.state.currentIndex - 1 + this.state.playlist.length) % this.state.playlist.length;
                this.state.currentIndex = prevIndex;
                this.loadSong(this.state.playlist[prevIndex]);
            },
            
            setMode() {
                const modes = ['loop', 'random', 'one']; 
                const icons = {'loop': 'repeat', 'random': 'shuffle', 'one': 'repeat-1'};
                
                const currentIdx = modes.indexOf(this.state.mode);
                const nextMode = modes[(currentIdx + 1) % modes.length];
                this.state.mode = nextMode;
                
                // 同时更新两个页面的按钮图标和颜色
                const btnIds = ['btn-mode', 'lyrics-btn-mode'];
                btnIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    btn.innerHTML = `<i data-lucide="${icons[nextMode]}" size="${id === 'btn-mode' ? '18' : '24'}"></i>`;
                    
                    if (nextMode !== 'loop') {
                        btn.classList.add('text-brand-500');
                    } else {
                        btn.classList.remove('text-brand-500');
                    }
                });
            
                // 处理单曲循环逻辑
                this.elements.audio.loop = (nextMode === 'one');
                lucide.createIcons();
            },
            
            setVolume(val) {
                this.elements.audio.volume = val;
            },

            // 辅助函数
            formatTime(seconds) {
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            },

            toggleLyricsPage() {
                const page = document.getElementById('lyrics-page');
                page.classList.toggle('translate-y-full');
            },

            // 歌单管理
            renderNav() {
                const playlists = Storage.getPlaylists();
                const container = document.getElementById('playlist-nav');
                const mobileContainer = document.getElementById('mobile-playlist-nav');
                
                const html = Object.keys(playlists).map(name => `
                    <button onclick="app.openPlaylist('${name}'); toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm text-gray-400 rounded hover:bg-gray-800 hover:text-white transition truncate flex items-center gap-2 group">
                        <i data-lucide="list-music" size="16" class="group-hover:text-brand-500 transition-colors"></i> 
                        <span>${name}</span>
                    </button>
                `).join('');
                
                container.innerHTML = html;
                mobileContainer.innerHTML = html;
                lucide.createIcons();
            },

            createPlaylist() {
                const name = prompt("请输入新歌单名称：");
                if (name && name.trim()) {
                    if (Storage.addPlaylist(name.trim())) {
                        this.renderNav();
                    } else {
                        alert("该歌单已存在！");
                    }
                }
            },

            deleteCurrentPlaylist() {
                const name = this.state.activePlaylistView;
                if(confirm(`确定要永久删除歌单“${name}”吗？`)) {
                    if(Storage.deletePlaylist(name)) {
                        this.navigate('search'); // 回到搜索页
                        this.renderNav();
                    }
                }
            },

            // 弹窗与收藏逻辑
            showAddToPlaylistModal(song) {
                if(!song) return;
                const modal = document.getElementById('modal-playlist');
                const list = document.getElementById('modal-playlist-list');
                const playlists = Object.keys(Storage.getPlaylists());
                
                list.innerHTML = playlists.map(name => `
                    <div class="flex items-center justify-between p-3 bg-gray-700/30 border border-gray-600/50 rounded-lg hover:bg-gray-700 cursor-pointer transition mb-2" onclick='app.addSongToPlaylist("${name}", ${JSON.stringify(song).replace(/'/g, "&#39;")})'>
                        <span class="text-gray-200 text-sm font-medium flex items-center gap-2">
                             <i data-lucide="list-music" size="14" class="text-gray-400"></i> ${name}
                        </span>
                        <i data-lucide="plus" size="16" class="text-brand-500"></i>
                    </div>
                `).join('');
                lucide.createIcons();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            },

            addSongToPlaylist(playlistName, song) {
                if (Storage.addSong(playlistName, song)) {
                    document.getElementById('modal-playlist').classList.add('hidden');
                    // 同步更新收藏按钮状态
                    if(this.state.currentSong && this.state.currentSong.id === song.id) {
                         this.updateLikeButton();
                    }
                    alert(`已成功添加到 "${playlistName}"`);
                } else {
                    alert("歌曲已存在于该歌单");
                }
            },

            removeFromPlaylist(playlistName, songId) {
                if(confirm('确定移除这首歌吗？')) {
                    Storage.removeSong(playlistName, songId);
                    this.openPlaylist(playlistName); // 刷新列表
                }
            },
            
            // 快捷收藏当前播放
            addToPlaylistUI() {
                if (!this.state.currentSong) return;
                const isLiked = Storage.isLiked(this.state.currentSong);
                if (isLiked) {
                    Storage.removeSong('我喜欢的音乐', this.state.currentSong.id);
                } else {
                    Storage.addSong('我喜欢的音乐', this.state.currentSong);
                }
                this.updateLikeButton();
            },

            updateLikeButton() {
                const isLiked = Storage.isLiked(this.state.currentSong);
                const colorClass = isLiked ? 'fill-red-500 text-red-500' : 'text-gray-400';
                
                ['player-fav-icon', 'lyrics-fav-icon'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) {
                        el.setAttribute('class', `transition ${colorClass}`);
                    }
                });
            }
        };

        const backupMgr = {
            configKey: 'tunehub_backup_config',
            intervalId: null,

            getConfig() {
                const defaultCfg = { workerUrl: '', path: 'tunehub_v1', retention: 5, mode: 'manual', interval: 30, autoSync: false };
                return Object.assign(defaultCfg, JSON.parse(localStorage.getItem(this.configKey) || '{}'));
            },

            init() {
                const cfg = this.getConfig();
                // 自动加载逻辑：稍微延迟执行，确保 Storage 对象已完全加载
                if (cfg.autoSync && cfg.workerUrl) {
                    setTimeout(() => this.loadLatestFromCloud(true), 500); 
                }
                
                this.setupInterval();
                
                window.addEventListener('beforeunload', () => {
                    if (cfg.mode === 'interval' || cfg.mode === 'instant') this.manualBackup(true);
                });

                // 动态监听模式切换
                const modeSelect = document.getElementById('cfg-mode');
                if (modeSelect) {
                    modeSelect.addEventListener('change', (e) => {
                        document.getElementById('cfg-interval-box').classList.toggle('hidden', e.target.value !== 'interval');
                    });
                }
            },

            setupInterval() {
                if (this.intervalId) clearInterval(this.intervalId);
                const cfg = this.getConfig();
                if (cfg.mode === 'interval' && cfg.workerUrl) {
                    this.intervalId = setInterval(() => this.manualBackup(true), cfg.interval * 60000);
                }
            },

            // --- 功能：上传备份 ---
            async manualBackup(silent = false) {
                const cfg = this.getConfig();
                if (!cfg.workerUrl) return !silent && alert('请先配置 Worker 接口地址');
                try {
                    const res = await fetch(`${cfg.workerUrl}?path=${cfg.path}`, {
                        method: 'POST',
                        body: JSON.stringify({ data: Storage.get(), retention: parseInt(cfg.retention) }),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (res.ok && !silent) alert('云端备份同步成功！');
                } catch (e) {
                    console.error('Upload failed:', e);
                    if (!silent) alert('备份失败，请检查 Worker 地址或跨域设置');
                }
            },

            // --- 功能：手动下载恢复 ---
            async manualRestore() {
                if (confirm('确定要从云端恢复备份吗？这将覆盖你当前浏览器中的所有歌单数据！')) {
                    await this.loadLatestFromCloud(false);
                }
            },

            // --- 核心：从云端加载数据 ---
            async loadLatestFromCloud(isAuto = false) {
                const cfg = this.getConfig();
                if (!cfg.workerUrl) return;

                try {
                    const res = await fetch(`${cfg.workerUrl}?path=${cfg.path}`);
                    const remoteData = await res.json();
                    
                    if (remoteData && remoteData.playlists) {
                        const localDataStr = localStorage.getItem(Storage.getKey());
                        const remoteDataStr = JSON.stringify(remoteData);

                        // 如果数据不一致，则覆盖
                        if (localDataStr !== remoteDataStr) {
                            Storage.save(remoteData, true); // true 表示不触发实时上传死循环
                            
                            if (isAuto) {
                                console.log('检测到云端有更新，已自动同步');
                                // 自动加载时，静默刷新导航和视图
                                app.renderNav();
                                if (app.state.activePlaylistView) app.openPlaylist(app.state.activePlaylistView);
                            } else {
                                alert('云端数据恢复成功！页面即将刷新以应用更改。');
                                location.reload(); // 手动恢复时，刷新页面最稳妥
                            }
                        } else if (!isAuto) {
                            alert('云端数据与本地一致，无需恢复。');
                        }
                    } else if (!isAuto) {
                        alert('云端未发现任何备份文件。');
                    }
                } catch (e) {
                    console.error('Load failed:', e);
                    if (!isAuto) alert('从云端获取数据失败，请检查网络或 Worker 配置。');
                }
            },

            showModal() {
                const cfg = this.getConfig();
                const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };
                setVal('cfg-worker-url', cfg.workerUrl);
                setVal('cfg-backup-path', cfg.path);
                setVal('cfg-retention', cfg.retention);
                setVal('cfg-mode', cfg.mode);
                setVal('cfg-interval', cfg.interval);
                
                const autoSyncEl = document.getElementById('cfg-auto-sync');
                if (autoSyncEl) autoSyncEl.checked = cfg.autoSync;

                document.getElementById('cfg-interval-box').classList.toggle('hidden', cfg.mode !== 'interval');
                document.getElementById('modal-backup-settings').classList.replace('hidden', 'flex');
                lucide.createIcons();
            },

            hideModal() { 
                document.getElementById('modal-backup-settings').classList.replace('flex', 'hidden'); 
            },

            saveConfig() {
                const newCfg = {
                    workerUrl: document.getElementById('cfg-worker-url').value.replace(/\/$/, ""),
                    path: document.getElementById('cfg-backup-path').value || 'tunehub_v1',
                    retention: document.getElementById('cfg-retention').value,
                    mode: document.getElementById('cfg-mode').value,
                    interval: document.getElementById('cfg-interval').value,
                    autoSync: document.getElementById('cfg-auto-sync').checked
                };
                localStorage.setItem(this.configKey, JSON.stringify(newCfg));
                this.setupInterval();
                this.hideModal();
                alert('配置已保存');
                // 如果开启了自动同步，立即执行一次检查
                if (newCfg.autoSync) this.loadLatestFromCloud(true);
            }
        };

        // 注入到原有的 Storage.save 逻辑中
        const OriginalSave = Storage.save;
        Storage.save = function(data, skipCloud = false) {
            OriginalSave(data);
            if (!skipCloud && backupMgr.getConfig().mode === 'instant') backupMgr.manualBackup(true);
        };

        // 在 window.onload 处增加初始化
        const oldLoad = window.onload;
        window.onload = () => { if(oldLoad) oldLoad(); backupMgr.init(); };

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.add('hidden');
            lucide.createIcons();
        }

        // 启动应用
        window.onload = () => app.init();

    </script>
</body>
</html>
